name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '10'
            illuminate: '^10.0'
            phpunit: '^10.5'
          - php: '8.2'
            laravel: '10'
            illuminate: '^10.0'
            phpunit: '^10.5'
          - php: '8.2'
            laravel: '11'
            illuminate: '^11.0'
            phpunit: '^10.5'
          - php: '8.3'
            laravel: '11'
            illuminate: '^11.0'
            phpunit: '^10.5 || ^11.0'
          - php: '8.3'
            laravel: '12'
            illuminate: '^12.0'
            phpunit: '^10.5 || ^11.0'
          - php: '8.4'
            laravel: '12'
            illuminate: '^12.0'
            phpunit: '^10.5 || ^11.0'
          - php: '8.4'
            laravel: '13'
            illuminate: '^13.0'
            phpunit: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Set Laravel dependency versions
        run: |
          composer require --no-update \
            illuminate/config:${{ matrix.illuminate }} \
            illuminate/container:${{ matrix.illuminate }} \
            illuminate/filesystem:${{ matrix.illuminate }} \
            illuminate/http:${{ matrix.illuminate }} \
            illuminate/support:${{ matrix.illuminate }} \
            phpunit/phpunit:"${{ matrix.phpunit }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Lint PHP files
        run: |
          find config src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: vendor/bin/phpunit -c phpunit.xml
